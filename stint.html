<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VirtualRaceHUB Stint-Plan</title><style>body{margin:0;background:#050607;color:#e6edf3;font-family:"Segoe UI",system-ui,sans-serif}#r{max-width:1280px;margin:0 auto;padding:22px 24px 40px}.st-root{--sb:#0b1117;--sbd:#1c2630;--sc:#121a22;--st:#e6edf3;--ss:#8b98a5;--sm:#5d6b78;--sa:#13b6c9;color:var(--st);font-size:14px;user-select:none}
.st-root *{box-sizing:border-box}
.st-bar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.st-bar b{font-size:18px}
.st-root .sp{flex:1}
.st-root button,.st-root select{font:inherit;color:var(--st);background:var(--sc);border:1px solid var(--sbd);border-radius:8px;padding:7px 12px;cursor:pointer}
.st-root button:hover{border-color:var(--sa)}
.st-root button:disabled{opacity:.4;cursor:default}
.st-root button.ghost{background:transparent;color:var(--ss)}
.st-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
.st-card{background:var(--sc);border:1px solid var(--sbd);border-radius:12px;padding:14px 16px;min-width:0}
.st-card.wide{margin-bottom:14px}
.st-card h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ss);margin-bottom:10px;font-weight:600}
.st-card h3 small{float:right;text-transform:none;letter-spacing:0;color:var(--sa);font-size:13px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;color:var(--ss)}
.kv>span:first-child{flex:none}
.kv>*:last-child,.kv b{color:var(--st)}
.kv i,.note,.st-empty{color:var(--sm);font-style:normal;font-size:12.5px}
.note{margin-top:8px}
.acc{color:var(--sa)!important}
.ed{display:inline-block;min-width:24px;padding:1px 3px;border-radius:4px;outline:none;color:var(--st);cursor:text;border-bottom:1px dotted transparent}
.ed:hover{border-bottom-color:var(--sm)}
.ed:focus{background:#0d141a;border-bottom-color:var(--sa)}
.src{font-size:11px;color:var(--sm);margin-left:4px}.src.hot{color:var(--sa)}
.seg{display:inline-flex;background:var(--sb);border:1px solid var(--sbd);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;padding:4px 10px;color:var(--ss)}
.seg button.on{background:var(--sa);color:#001014}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.drv{padding:6px 0;border-bottom:1px solid var(--sbd);display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.drv:last-of-type{border:0}
.drv .sub{flex-basis:100%;font-size:12.5px;color:var(--sm);padding-left:22px}
.drv .ir{color:var(--ss)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none;position:relative;vertical-align:middle}
label.dot input{opacity:0;position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.x{color:var(--sm);cursor:pointer;margin-left:6px}.x:hover{color:#ff5c6c}
.add{display:inline-block;margin-top:8px;color:var(--sa);cursor:pointer}
.tbl .th{display:flex;align-items:center;gap:14px;margin-bottom:8px}.tbl .th h3{margin:0}
.inc{color:var(--ss)}.inc b{color:var(--st)}.inc.warn b{color:#f5b84a}.inc.bad b{color:#ff5c6c}
.st-root table{width:100%;border-collapse:collapse;font-size:13.5px}
.st-root th{text-align:left;font-weight:600;font-size:11.5px;color:var(--sm);padding:8px;background:#0d141a;text-transform:uppercase;letter-spacing:.04em}
.st-root td{padding:9px 8px;border-top:1px solid var(--sbd);vertical-align:top;background:#0f161d}
.st-root .r{text-align:right}.mono{font-family:"Cascadia Code",Consolas,monospace;font-size:13px}
.stp{color:var(--sm);font-size:12px;margin-top:2px}
.grip{width:26px;color:var(--sm);cursor:grab}.grip span{cursor:pointer}
tr.lock td{background:#101a21}
tr.drag{opacity:.4}tr.over td{border-top:2px solid var(--sa)}
.dbl{font-size:11px;color:var(--ss);background:#1a242d;padding:2px 7px;border-radius:99px;margin-left:6px}
.na{font-size:11px;color:#f5b84a;margin-left:6px}
.chip{font-size:12px;padding:2px 9px;border-radius:99px;background:#1a242d}.chip.w{color:var(--sa)}.chip.t{color:#f5b84a}
.sums{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 28px}
.sum{display:flex;gap:14px;align-items:center;color:var(--ss)}.sum b{color:var(--st);min-width:110px}.sum i{color:var(--sm);font-style:normal}
.st-foot{color:var(--sm);font-size:12.5px;margin:6px 2px 20px}.err{color:#ff5c6c}
.st-empty{padding:40px;text-align:center}
.sel{user-select:text}
sup{font-size:10px;color:var(--sm);margin-left:2px}
@media(max-width:1000px){.st-cards,.cols3{grid-template-columns:1fr}.sums{grid-template-columns:1fr}.st-root{overflow-x:auto}}
</style></head>
<body><div id="r" class="st-root"></div><script>/* VirtualRaceHUB Stint-Planer – Kern + Oberfläche (wird von Garage und Link-Ansicht genutzt) */
(function () {
const PAL = ["#1e9bff", "#9aa0a6", "#e066e0", "#2fbf6a", "#f5b84a", "#ff6b5c", "#8b3dff", "#13b6c9"];
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const p2 = n => String(Math.floor(n)).padStart(2, "0");
const hms = t => { t = Math.round(t); const s = ((t % 86400) + 86400) % 86400; return p2(s / 3600) + ":" + p2(s % 3600 / 60) + ":" + p2(s % 60); };
const dayOff = t => Math.floor(Math.round(t) / 86400);
const clock = t => hms(t) + (dayOff(t) > 0 ? `<sup>+${dayOff(t)}</sup>` : "");
const dur = t => { t = Math.round(t); const h = Math.floor(t / 3600); return (h ? h + ":" : "") + p2(t % 3600 / 60).replace(/^0(?=\d:)/, "0") + ":" + p2(t % 60); };
const ms = t => Math.floor(Math.round(t) / 60) + ":" + p2(Math.round(t) % 60);
const lapFmt = t => { if (!t) return "–"; const m = Math.floor(t / 60); return m + ":" + (t - m * 60).toFixed(3).padStart(6, "0"); };
const nf = (v, d = 2) => (Math.round(v * Math.pow(10, d)) / Math.pow(10, d)).toString().replace(".", ",");

/* ---- Eingaben lesen ---- */
function parseNum(s) { const v = parseFloat(String(s).replace(",", ".")); return isFinite(v) ? v : 0; }
function parseDur(s) { // "1:13", "53", "1:30:00" -> Sekunden
  s = String(s).trim().replace(",", "."); if (!s) return 0;
  const p = s.split(":").map(x => parseFloat(x) || 0); let t = 0; p.forEach(x => t = t * 60 + x); return p.length === 1 ? p[0] : t;
}
function parseHM(s) { const p = String(s).trim().split(":").map(x => parseFloat(x) || 0); return ((p[0] || 0) * 3600 + (p[1] || 0) * 60 + (p[2] || 0)); }
function parseAvail(s) {
  const out = []; String(s || "").replace(/(\d{1,2})(?::\d\d)?\s*(?:-|–|bis)\s*(\d{1,2})(?::\d\d)?/g, (m, a, b) => { out.push([+a, +b]); return m; }); return out;
}
function availAt(d, hour) { // hour 0..24 (Dezimal)
  const av = parseAvail(d.avail); if (!av.length) return true; hour = ((hour % 24) + 24) % 24;
  return av.some(([a, b]) => a === b ? true : a < b ? hour >= a && hour < b : hour >= a || hour < b);
}
function availSpan(d, from, to) { // Fahrer über ganzes Fenster (Sekunden seit 0 Uhr, to darf > 86400)
  for (let t = from; t < to; t += 600) if (!availAt(d, t / 3600)) return false;
  return availAt(d, (to - 1) / 3600);
}

/* ---- Modell ---- */
function newPlan(who) {
  const id = "p" + Math.random().toString(36).slice(2, 10);
  return {
    id, name: "", rev: Date.now(), updated_by: who || "", updated_at: Date.now(),
    event: { team: "", name: "", date: "", car: "", cars: "", inc: 150, mode: "double" },
    times: { warm: { start: "", dur: "" }, quali: { start: "", dur: "" }, race: { start: "13:40", dur: "24:00" } },
    fuel: { tank: 100, cons: 3.2, pit: 20, t1: 6, t4: 24, fill: 35, swap: 53, tires: 4, together: true, lap: 0, cons_g61: 0 },
    drivers: [], stints: [], online: false, view_token: "", edit_token: ""
  };
}

function eff(plan) { // wirksame Werte (Garage 61 geht vor Handwerte)
  const f = plan.fuel, cons = f.cons_g61 > 0 ? f.cons_g61 : f.cons;
  const lapsTank = cons > 0 ? Math.floor(f.tank / cons + 1e-9) : 0;
  return { cons, consSrc: f.cons_g61 > 0 ? "Garage 61" : "manuell", lapsTank };
}
function lapOf(plan, d) { return d.lap_g61 > 0 ? d.lap_g61 : d.lap > 0 ? d.lap : plan.fuel.lap > 0 ? plan.fuel.lap : 0; }
function lapSrc(plan, d) { return d.lap_g61 > 0 ? "Garage 61" : d.lap > 0 ? "manuell" : plan.fuel.lap > 0 ? "Standard" : "fehlt"; }
function work(plan) {
  const f = plan.fuel, tires = f.tires == 4 ? f.t4 : f.tires == 1 ? f.t1 : 0;
  return f.together ? Math.max(f.fill, tires) : f.fill + tires;
}
function pitTimes(plan) {
  const f = plan.fuel, w = work(plan);
  return { change: f.pit + Math.max(w, f.swap), fuelOnly: f.pit + w, work: w };
}

/* Zeiten aller Stints berechnen */
function calc(plan) {
  const e = eff(plan), pt = pitTimes(plan), raceDur = parseHM(plan.times.race.dur), start = parseHM(plan.times.race.start);
  const rows = []; let t = 0;
  for (let i = 0; i < plan.stints.length; i++) {
    const s = plan.stints[i], d = plan.drivers[s.d]; const lap = d ? lapOf(plan, d) : 0;
    let laps = e.lapsTank; const left = raceDur - t;
    if (lap > 0 && left < laps * lap) laps = Math.max(1, Math.ceil(left / lap));
    const st = laps * lap, last = i === plan.stints.length - 1 || t + st >= raceDur - 0.5, short = i === plan.stints.length - 1 && t + st < raceDur - 0.5;
    const next = plan.stints[i + 1], same = next && next.d === s.d;
    const after = last ? "" : same ? "Nur tanken" : "Wechsel";
    const stop = last ? 0 : same ? pt.fuelOnly : pt.change;
    rows.push({ i, d: s.d, laps, st, startAbs: start + t, endAbs: start + t + st, stop, after, resume: start + t + st + stop, tAbs: t, last, lap, short });
    t += st + stop; if (last) break;
  }
  return rows;
}

/* Automatische Planung */
function autoPlan(plan) {
  const e = eff(plan), pt = pitTimes(plan), raceDur = parseHM(plan.times.race.dur), start = parseHM(plan.times.race.start);
  const nd = plan.drivers.length; if (!nd || !e.lapsTank) return plan.stints;
  const old = plan.stints, out = [], tot = new Array(nd).fill(0), mode = plan.event.mode;
  let t = 0, i = 0, guard = 0;
  const avg = () => tot.reduce((a, b) => a + b, 0) / nd;
  while (t < raceDur - 0.5 && guard++ < 200) {
    const lk = old[i] && old[i].lock ? old[i] : null; let pick = -1, fixedLen = 0;
    const lenFor = di => { const lap = lapOf(plan, plan.drivers[di]) || 120; let laps = e.lapsTank; if (raceDur - t < laps * lap) laps = Math.max(1, Math.ceil((raceDur - t) / lap)); return laps * lap; };
    const okFor = di => { const L = lenFor(di); return availSpan(plan.drivers[di], start + t, start + t + L + pt.change); };
    const prev = out.length ? out[out.length - 1].d : -1, prevPair = out.length > 1 && out[out.length - 2].d === prev;
    if (lk) pick = lk.d;
    else {
      const cands = plan.drivers.map((d, di) => di).filter(okFor);
      const wantSame = prev >= 0 && !prevPair && (mode === "double" || (mode === "mixed" && tot[prev] <= avg() + 1)) && cands.includes(prev);
      if (wantSame) pick = prev;
      else {
        let pool = cands.filter(di => di !== prev); if (!pool.length) pool = cands;
        if (!pool.length) pool = plan.drivers.map((d, di) => di).filter(di => di !== prev);
        if (!pool.length) pool = [0];
        pick = pool.reduce((b, di) => tot[di] < tot[b] ? di : b, pool[0]);
      }
    }
    const L = lenFor(pick); tot[pick] += L;
    out.push({ d: pick, lock: !!(lk && lk.lock), inc: old[i] ? old[i].inc || 0 : 0 });
    t += L + pt.change; i++;
  }
  return out;
}

/* ---- Oberfläche ---- */
function create(root, io) {
  const S = { plans: [], cur: null, undo: [], msg: "", dragI: -1, readonly: !!io.readonly, base: "", who: "", saveT: 0, lastEdit: 0, shareOpen: false };
  const plan = () => S.plans.find(p => p.id === S.cur) || null;
  const snap = () => { const p = plan(); if (!p || S.readonly) return; S.undo.push(JSON.stringify(p)); if (S.undo.length > 60) S.undo.shift(); };
  function touch(p) {
    p.rev = Date.now(); p.updated_at = p.rev; p.updated_by = S.who || p.updated_by || ""; S.lastEdit = Date.now();
    clearTimeout(S.saveT); S.saveT = setTimeout(() => persist(p), 800);
  }
  async function persist(p) {
    try { await io.save(p); } catch (e) {}
    if (p.online && p.edit_token) {
      try { const r = await io.push(p, false); if (r && !r.ok) S.msg = r.error || ""; else { S.msg = ""; if (r.res) p.srv = +r.res; } } catch (e) {}
    }
  }
  function set(path, val, plain) {
    const p = plan(); if (!p) return; snap();
    const k = path.split("."); let o = p; for (let i = 0; i < k.length - 1; i++) o = o[k[i]]; o[k[k.length - 1]] = val;
    if (/^(drivers\.\d+\.(lap|name|avail)|fuel\.|times\.race|event\.mode)/.test(path) && !plain) { /* Plan bleibt, Zeiten ändern sich */ }
    if (/^(event\.mode)/.test(path)) p.stints = autoPlan(p);
    ensure(p); touch(p); draw();
  }
  function ensure(p) {
    if (!p.drivers.length) return;
    if (!p.stints.length) { p.stints = autoPlan(p); return; }
    let rows = calc(p);
    if (rows.length && rows[rows.length - 1].short) {
      const old = p.stints, full = autoPlan({ ...p, stints: old.map(s => ({ ...s, lock: true })) });
      p.stints = full.map((s, i) => i < old.length ? old[i] : { ...s, lock: false });
    }
    rows = calc(p); if (rows.length < p.stints.length) p.stints.length = rows.length;
  }

  /* Eingabefelder (flach, direkt änderbar) */
  const ed = (path, val, t, cls) => `<span class="ed ${cls || ""}" ${S.readonly ? "" : 'contenteditable="true" spellcheck="false"'} data-p="${path}" data-t="${t || "s"}">${esc(val)}</span>`;
  const src = (txt, hot) => `<span class="src${hot ? " hot" : ""}">${txt}</span>`;

  function totals(p, rows) {
    const per = p.drivers.map(() => ({ t: 0, laps: 0, inc: 0, n: 0 })); let inc = 0;
    rows.forEach(r => { const q = per[r.d]; if (q) { q.t += r.st; q.laps += r.laps; q.n++; q.inc += (p.stints[r.i].inc || 0); } inc += (p.stints[r.i].inc || 0); });
    return { per, inc };
  }

  function draw() {
    const p = plan(); if (!root) return;
    if (document.activeElement && root.contains(document.activeElement) && document.activeElement.isContentEditable) return;
    let h = bar(p);
    if (!p) { root.innerHTML = h + `<div class="st-empty">${S.readonly ? "Plan wird geladen …" : "Noch kein Plan. Mit „Neuer Plan“ startest du einen Stint-Plan."}</div>`; wire(); return; }
    const e = eff(p), pt = pitTimes(p), rows = calc(p), tt = totals(p, rows);
    const avgIR = p.drivers.length ? Math.round(p.drivers.reduce((a, d) => a + (+d.ir || 0), 0) / p.drivers.length) : 0;
    const incCls = tt.inc >= p.event.inc ? "bad" : tt.inc >= p.event.inc * .8 ? "warn" : "";
    const m = p.event.mode;
    h += `<div class="st-cards">
      <div class="st-card"><h3>Event</h3>
        <div class="kv"><span>Team</span>${ed("event.team", p.event.team || "–")}</div>
        <div class="kv"><span>Event</span>${ed("event.name", p.event.name || "–")}</div>
        <div class="kv"><span>Datum</span>${ed("event.date", p.event.date || "–")}</div>
        <div class="kv"><span>Auto</span>${ed("event.car", p.event.car || "–")}</div>
        <div class="kv"><span>Autos im Rennen</span>${ed("event.cars", p.event.cars || "–")}</div>
        <div class="kv"><span>INC-Limit</span>${ed("event.inc", p.event.inc, "n")}</div>
        <div class="kv"><span>Stints</span><span class="seg">${[["single", "Einzel"], ["double", "Doppel"], ["mixed", "Gemischt"]].map(([k, l]) => `<button data-mode="${k}" class="${m === k ? "on" : ""}" ${S.readonly ? "disabled" : ""}>${l}</button>`).join("")}</span></div>
      </div>
      <div class="st-card"><h3>Zeiten</h3>
        ${[["warm", "Warm-up"], ["quali", "Qualifying"], ["race", "Rennen"]].map(([k, l]) => `<div class="kv"><span>${l}</span><span>${ed("times." + k + ".start", p.times[k].start || "–")} <i>Start</i> · ${ed("times." + k + ".dur", p.times[k].dur || "–")} <i>Dauer</i></span></div>`).join("")}
        <div class="note">Alle Zeiten in einer Zeitzone (hh:mm).</div>
      </div>
      <div class="st-card"><h3>Fahrer <small>Team-iRating ${avgIR || "–"}</small></h3>
        ${p.drivers.map((d, i) => `<div class="drv"><label class="dot" style="background:${d.color}"><input type="color" value="${d.color}" data-col="${i}" ${S.readonly ? "disabled" : ""}></label>
          ${ed("drivers." + i + ".name", d.name || "Name")}<span class="sp"></span>${ed("drivers." + i + ".ir", d.ir || 0, "n", "ir")}
          <div class="sub">Verfügbar ${ed("drivers." + i + ".avail", d.avail || "–")} · Runde ${ed("drivers." + i + ".lap", d.lap_g61 > 0 ? lapFmt(d.lap_g61) : d.lap > 0 ? lapFmt(d.lap) : "–", "l")} ${src(lapSrc(p, d), d.lap_g61 > 0)}${S.readonly ? "" : ` <a data-deld="${i}" class="x" title="Fahrer entfernen">×</a>`}</div></div>`).join("")}
        ${S.readonly ? "" : `<a class="add" data-addd="1">+ Fahrer</a>`}
      </div>
    </div>
    <div class="st-card wide"><h3>Kraftstoff &amp; Boxenstopp</h3>
      <div class="cols3">
        <div>
          <div class="kv"><span>Tank (L)</span>${ed("fuel.tank", p.fuel.tank, "n")}</div>
          <div class="kv"><span>Verbrauch (L/Runde)</span><span>${ed("fuel.cons", nf(p.fuel.cons), "n")} ${src(e.consSrc, e.consSrc === "Garage 61")}${e.consSrc === "Garage 61" ? ` <i>(${nf(e.cons)})</i>` : ""}</span></div>
          <div class="kv"><span>Runden pro Tank</span><b>${nf(p.fuel.tank / (e.cons || 1), 2)}</b> <i>→ ${e.lapsTank} Runden</i></div>
          <div class="kv"><span>Standard-Rundenzeit</span>${ed("fuel.lap", p.fuel.lap > 0 ? lapFmt(p.fuel.lap) : "–", "l")}</div>
        </div>
        <div>
          <div class="kv"><span>Durchfahrt Boxengasse</span>${ed("fuel.pit", p.fuel.pit, "d")}</div>
          <div class="kv"><span>1 Reifen</span>${ed("fuel.t1", p.fuel.t1, "d")}</div>
          <div class="kv"><span>Alle 4 Reifen</span>${ed("fuel.t4", p.fuel.t4, "d")}</div>
          <div class="kv"><span>Volltanken</span>${ed("fuel.fill", p.fuel.fill, "d")}</div>
          <div class="kv"><span>Fahrerwechsel</span>${ed("fuel.swap", p.fuel.swap, "d")}</div>
        </div>
        <div>
          <div class="kv"><span>Reifen im Stopp</span><span class="seg">${[[0, "keine"], [1, "1"], [4, "alle 4"]].map(([k, l]) => `<button data-tires="${k}" class="${p.fuel.tires == k ? "on" : ""}" ${S.readonly ? "disabled" : ""}>${l}</button>`).join("")}</span></div>
          <div class="kv"><span>Tanken und Reifen</span><span class="seg"><button data-tog="1" class="${p.fuel.together ? "on" : ""}" ${S.readonly ? "disabled" : ""}>gleichzeitig</button><button data-tog="0" class="${p.fuel.together ? "" : "on"}" ${S.readonly ? "disabled" : ""}>nacheinander</button></span></div>
          <div class="kv"><span>Boxenstopp mit Wechsel</span><b class="acc">${ms(pt.change)}</b></div>
          <div class="kv"><span>Nur tanken</span><b>${ms(pt.fuelOnly)}</b></div>
          <div class="note">Fahrerwechsel läuft parallel zum Tanken. Werte aus Garage 61 ersetzen die Handwerte automatisch.</div>
        </div>
      </div>
    </div>`;
    h += `<div class="st-card wide tbl"><div class="th"><h3>Stints</h3><span class="inc ${incCls}">Gesamt-INC <b>${tt.inc}</b> / ${p.event.inc}</span><span class="sp"></span>
      <span class="note">${rows.length} Stints · ${e.lapsTank} Runden pro Tank</span></div>
      <table><thead><tr><th></th><th>Nr</th><th>Fahrer</th><th>Zeit</th><th class="r">Runden</th><th class="r">Ziel-Rundenzeit</th><th class="r">Stintzeit</th><th>Danach</th><th class="r">INC</th></tr></thead><tbody>
      ${rows.map(r => rowHtml(p, r)).join("") || `<tr><td colspan="9" class="empty">Noch keine Fahrer – füge Fahrer hinzu.</td></tr>`}
      </tbody></table></div>`;
